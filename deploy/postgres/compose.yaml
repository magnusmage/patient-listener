# Local rehearsal defaults. Remote access requires compose.tls.yaml + firewall/VPN.
services:
  postgres:
    image: ${PL_PG_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: listener_admin
      POSTGRES_DB: patient_listener
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${PL_PG_BIND:-127.0.0.1}:${PL_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    secrets:
      - admin_password
      - app_password
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U listener_admin -d patient_listener"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
volumes:
  pgdata:
secrets:
  admin_password:
    file: ${PL_PG_SECRET_DIR:?Run postgres_deploy init first}/admin_password
  app_password:
    file: ${PL_PG_SECRET_DIR:?Run postgres_deploy init first}/app_password
