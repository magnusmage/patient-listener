# Local socket is limited to processes within the DB container/admin Docker access.
local all all trust
# Network clients cannot use cleartext or the bootstrap administrator.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl patient_listener patient_listener_app 0.0.0.0/0 scram-sha-256
hostssl patient_listener patient_listener_app ::/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
