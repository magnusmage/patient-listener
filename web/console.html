<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Patient Listener — therapist console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
  <style>
    /* Console shell + tables, copied from the Carer & Therapist prototype. */
    #root { font-family: var(--pl-font); color: var(--pl-text); }
    .con-shell { display: flex; min-height: 100dvh; }
    .con-side { flex: none; width: 240px; background: var(--pl-surface); border-right: 1px solid var(--pl-line); display: flex; flex-direction: column; padding: 18px 14px; }
    .con-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 4px 8px 18px; color: var(--pl-text); }
    .con-logo .tile, .con-signlogo { display: inline-grid; place-items: center; border-radius: 8px; background: var(--pl-primary); color: var(--pl-on-primary); }
    .con-logo .tile { width: 30px; height: 30px; font-size: 12px; }
    .con-nav { display: flex; flex-direction: column; gap: 3px; }
    .con-nav button { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 10px; padding: 11px 12px; font: 600 15px var(--pl-font); color: var(--pl-muted); cursor: pointer; }
    .con-nav button[aria-current="true"] { background: var(--pl-tile); color: var(--pl-primary); }
    .con-foot { margin-top: auto; padding: 14px 8px 4px; border-top: 1px solid var(--pl-line); }
    .con-avatar { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; background: var(--pl-tile); color: var(--pl-primary); font-weight: 700; font-size: 13px; }
    .con-signout { margin-top: 10px; width: 100%; background: none; border: 1px solid var(--pl-line-strong); border-radius: 9px; padding: 8px; color: var(--pl-muted); font: 600 13px var(--pl-font); cursor: pointer; }
    .con-main { flex: 1; min-width: 0; padding: 28px 32px; overflow: auto; }
    .con-sechead { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
    .con-h1 { font-weight: 700; font-size: 28px; margin: 0; }
    .con-h2 { font-weight: 700; font-size: 24px; margin: 0; }
    .con-crumb { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .con-back { background: none; border: none; color: var(--pl-muted); font: 600 14px var(--pl-font); cursor: pointer; }
    .con-needpill { background: var(--pl-tile); color: var(--pl-muted); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
    .con-tablecard { background: var(--pl-surface); border: 1px solid var(--pl-line); border-radius: 16px; overflow: hidden; }
    .con-head { display: grid; gap: 12px; padding: 12px 20px; background: var(--pl-tile); font-size: 12px; font-weight: 600; color: var(--pl-muted); text-transform: uppercase; letter-spacing: .03em; }
    .con-row { display: grid; gap: 12px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--pl-line); }
    .con-pill { background: var(--pl-primary); color: var(--pl-on-primary); border: none; border-radius: 999px; padding: 9px 20px; font: 600 14px var(--pl-font); cursor: pointer; }
    .con-pill--ghost { background: var(--pl-surface); color: var(--pl-primary); border: 2px solid var(--pl-line-strong); }
    .con-pill:disabled { opacity: .5; cursor: not-allowed; }
    .con-card { background: var(--pl-surface); border: 1px solid var(--pl-line); border-radius: 16px; padding: 18px 20px; }
    .con-draft { background: var(--pl-hint-bg); border: 1px solid var(--pl-hint-line); border-radius: 14px; padding: 14px 18px; color: var(--pl-hint-ink); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .con-badge { background: #d8b45e; color: #3a2f12; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
    .con-cue { width: 100%; min-height: 40px; font-size: 15px; padding: 0 12px; border: 2px solid var(--pl-line-strong); border-radius: var(--pl-radius-input); background: var(--pl-surface); color: var(--pl-text); }
    .con-input { width: 100%; padding: 13px 16px; border: 1px solid var(--pl-line-strong); border-radius: 12px; font-size: 16px; background: var(--pl-surface); color: var(--pl-text); margin-bottom: 10px; }
    .con-addrow { display: flex; gap: 10px; align-items: center; }
    .con-addrow .con-input { margin-bottom: 0; flex: 1; }
    .con-alert { background: var(--pl-danger-bg); border: 1px solid var(--pl-danger); color: var(--pl-danger); border-radius: 12px; padding: 12px 16px; font-size: 15px; margin: 0 0 14px; }
    .con-sign { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .con-signlogo { width: 60px; height: 60px; border-radius: 16px; font-weight: 700; font-size: 22px; margin-bottom: 14px; }
    .con-signbtn { width: 100%; background: var(--pl-primary); color: var(--pl-on-primary); border: none; border-radius: 12px; padding: 16px; font: 600 18px var(--pl-font); cursor: pointer; }
    .con-demobtn { width: 100%; margin-top: 18px; background: transparent; color: var(--pl-primary); border: 2px dashed var(--pl-line-strong); border-radius: 12px; padding: 13px; font: 600 16px var(--pl-font); cursor: pointer; }
    .con-delete { background: #96222A; color: #fff; border: none; border-radius: 999px; padding: 11px 24px; font: 600 15px var(--pl-font); cursor: pointer; }
    @media (max-width: 720px) {
      .con-shell { flex-direction: column; min-height: 0; }
      .con-side { width: auto; border-right: none; border-bottom: 1px solid var(--pl-line); }
      .con-nav { flex-direction: row; flex-wrap: wrap; }
      .con-foot { margin-top: 12px; }
      .con-main { padding: 20px 16px; }
      .con-head { display: none; }
      .con-row { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <button class="pl-tab pl-theme-toggle" id="theme">🌗 theme</button>
  <main id="root" role="main"></main>

  <script>
  // Mock data is only used when explicitly opening the offline demo.
  const QUERY = new URLSearchParams(location.search);
  const API = (location.protocol.startsWith('http') && QUERY.get('mock') !== '1') ? '' : null;
  let accessToken = ''; // Memory only: never URLs, localStorage or sessionStorage.
  const DATA = {
    therapist: { name: 'Sam (SLT)' },
    caseload: [
      { id: 'margaret', name: 'Margaret', needs: ['Finding the word'], last: 'Today', returned: 9 },
      { id: 'daniyal', name: 'Daniyal', needs: ['Getting words started'], last: 'Yesterday', returned: 5 },
      { id: 'joseph', name: 'Joseph', needs: ['Being loud enough'], last: '2 days ago', returned: 7 },
    ],
    words: {
      margaret: [
        { id: 'w-leo', text: 'Leo', kind: 'person', cue: "Leo's your grandson, he's six", first: 'L', status: 'approved', by: 'slt' },
        { id: 'w-kettle', text: 'kettle', kind: 'object', cue: 'you boil water in it', first: 'K', status: 'approved', by: 'slt' },
        { id: 'w-whitby', text: 'Whitby', kind: 'place', cue: 'the seaside town', first: 'W', status: 'approved', by: 'slt' },
        { id: 'w-rex', text: 'Rex', kind: 'person', cue: "Leo's new puppy", first: 'R', status: 'draft', by: 'carer' },
      ],
    },
    grid: {
      margaret: { days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
        rows: [
          { word: 'Leo', cells: ['check', 'sound', 'none', 'check', 'check'] },
          { word: 'kettle', cells: ['meaning', 'check', 'check', 'word', 'check'] },
          { word: 'Whitby', cells: ['none', 'meaning', 'meaning', 'sound', 'check'] },
        ] },
    },
    settings: { margaret: { needs: ['Finding the word'], hintOrder: 'meaning-first', hintWait: 7, sessionMin: 20 } },
    consent: { margaret: { tellCarerLowMood: false, dataSharing: true } },
  };
  const CELL = { check: ['✓', 'pl-cell--check', 'found with no hint'], meaning: ['M', 'pl-cell--hint', 'found after meaning hint'], sound: ['S', 'pl-cell--hint', 'found after sound hint'], word: ['W', 'pl-cell--hint', 'found after hearing the word'], none: ['–', 'pl-cell--none', 'not tried'] };

  const root = document.getElementById('root');
  const S = { signedIn: false, tab: 'T2', person: 'margaret', role: 'therapist', demo: API == null, error: '', busy: false, phraseDraft: '' };
  function clearData() {
    S.phraseDraft = '';
    DATA.caseload = []; DATA.words = {}; DATA.grid = {}; DATA.settings = {}; DATA.consent = {};
  }
  if (API != null) clearData();

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'html') e.innerHTML = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] != null) e.setAttribute(k, attrs[k]); }
    for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
    return e;
  }

  const NAV = [['T2', 'Caseload'], ['T3', 'Word list'], ['T4', 'Progress'], ['T5', 'Profile & hints'], ['T6', 'Consent & export']];

  function render() {
    root.innerHTML = '';
    if (!S.signedIn) return root.append(signinScreen());
    const main = h('div', { class: 'con-main' });
    if (S.error) main.append(h('p', { role: 'alert', class: 'con-alert' }, S.error));
    main.append((({ T2: t2, T3: t3, T4: t4, T5: t5, T6: t6 }[S.tab]) || t2)());
    root.append(h('div', { class: 'con-shell' }, sidebar(), main));
  }

  function sidebar() {
    const side = h('aside', { class: 'con-side' });
    side.append(h('div', { class: 'con-logo' }, h('span', { class: 'tile' }, 'PL'), 'Patient Listener'));
    const nav = h('nav', { class: 'con-nav' });
    NAV.filter(([id]) => id !== 'T4' || S.role === 'therapist').forEach(([id, label]) =>
      nav.append(h('button', { 'aria-current': String(S.tab === id), onclick: () => { S.tab = id; render(); } }, label)));
    side.append(nav);
    side.append(h('div', { class: 'con-foot' },
      h('div', { style: 'display:flex;align-items:center;gap:10px' },
        h('span', { class: 'con-avatar' }, 'PT'),
        h('div', { style: 'line-height:1.2' },
          h('div', { style: 'font-weight:600;font-size:14px' }, DATA.therapist.name || '—'),
          h('div', { class: 'pl-muted', style: 'font-size:12px' }, S.role === 'therapist' ? 'Speech & language therapist' : 'Carer'))),
      S.demo ? h('div', { class: 'pl-muted', style: 'font-size:12px;margin-top:8px' }, 'Demo data only.') : null,
      h('button', { class: 'con-signout', onclick: signOut }, 'Sign out')));
    return side;
  }

  function patientHeader() {
    const p = DATA.caseload.find(x => x.id === S.person);
    return h('div', { class: 'con-crumb' },
      h('button', { class: 'con-back', onclick: () => { S.tab = 'T2'; render(); } }, '← Caseload'),
      h('span', { class: 'pl-muted' }, '/'),
      h('span', { style: 'font-weight:700;font-size:18px' }, name(S.person)),
      (p && p.needs && p.needs.length) ? h('span', { class: 'con-needpill' }, p.needs.join(', ')) : null);
  }

  // Sign in (prototype styling; keeps the access-token flow)
  function signinScreen() {
    const card = h('div', { style: 'width:100%;max-width:420px;text-align:center' },
      h('span', { class: 'con-signlogo' }, 'PL'),
      h('h1', { style: 'font-weight:700;font-size:28px;margin:0 0 4px' }, 'Therapist console'),
      h('p', { class: 'pl-muted', style: 'font-size:16px;margin:0 0 24px' }, API == null ? 'Offline demo — sample data only.' : 'Sign in to your caseload.'),
      API != null ? h('input', { id: 'access-token', class: 'con-input', type: 'password', 'aria-label': 'Console access token', autocomplete: 'off', spellcheck: 'false', placeholder: 'Access token' }) : null,
      S.error ? h('p', { role: 'alert', class: 'con-alert' }, S.error) : null,
      h('button', { class: 'con-signbtn', 'data-autofocus': '', disabled: S.busy ? '' : null, onclick: () => signIn(false) }, API == null ? 'Enter offline demo' : 'Sign in'),
      (API != null && QUERY.get('mode') === 'judge') ? h('button', { class: 'con-demobtn', disabled: S.busy ? '' : null, onclick: () => signIn(true) }, 'One-click demo login') : null,
    );
    const wrap = h('div', { class: 'con-sign' }, card);
    setTimeout(() => { const b = wrap.querySelector('button'); if (b) b.focus(); }, 0);
    return wrap;
  }

  // T2 caseload (prototype table)
  function t2() {
    const cols = '1.4fr 1.6fr 1fr .9fr auto';
    const wrap = h('div', {});
    wrap.append(h('div', { class: 'con-sechead' },
      h('h1', { class: 'con-h1' }, 'Your caseload'),
      h('span', { class: 'pl-muted', style: 'font-size:15px' }, `${DATA.caseload.length} linked patient${DATA.caseload.length === 1 ? '' : 's'}`)));
    wrap.append(h('p', { class: 'pl-muted', style: 'font-size:14px;margin:0 0 18px' }, 'Counts are words found without a hint. The console shows facts and makes no suggestions.'));
    if (!DATA.caseload.length) { wrap.append(h('div', { class: 'con-card' }, h('p', { class: 'pl-muted', style: 'margin:0' }, 'No patients linked yet.'))); return wrap; }
    const card = h('div', { class: 'con-tablecard' });
    card.append(h('div', { class: 'con-head', style: `grid-template-columns:${cols}` },
      h('span', {}, 'Patient'), h('span', {}, 'Need profile'), h('span', {}, 'Last session'), h('span', {}, 'Words / week'), h('span', {})));
    DATA.caseload.forEach(p => card.append(h('div', { class: 'con-row', style: `grid-template-columns:${cols}` },
      h('span', { style: 'font-weight:600;font-size:16px' }, p.name),
      h('span', { class: 'pl-muted', style: 'font-size:14px' }, (p.needs || []).join(', ')),
      h('span', { class: 'pl-muted', style: 'font-size:14px' }, p.last),
      h('span', { style: 'font-weight:600;font-size:16px' }, String(p.returned)),
      h('button', { class: 'con-pill', onclick: () => { S.person = p.id; S.tab = 'T3'; render(); } }, 'Open'))));
    wrap.append(card);
    return wrap;
  }

  // T3 word list (prototype: amber drafts + approved table + add phrase)
  function t3() {
    const words = DATA.words[S.person] || [];
    const canApprove = DATA.caseload.find(p => p.id === S.person)?.canApprove !== false;
    const wrap = h('div', {});
    wrap.append(patientHeader());
    wrap.append(h('div', { class: 'con-sechead' }, h('h2', { class: 'con-h2' }, 'Word list')));
    words.filter(w => w.status === 'draft').forEach(w => wrap.append(h('div', { class: 'con-draft', style: 'margin-bottom:12px' },
      h('span', { class: 'con-badge' }, `draft from ${w.by || 'carer'}`),
      h('span', { style: 'flex:1;min-width:200px;font-size:16px' }, h('b', {}, w.text), w.cue ? ` — ${w.cue}` : '', w.first ? ` · starts with “${w.first}”` : ''),
      canApprove
        ? h('button', { class: 'con-pill', onclick: () => approveWord(w) }, 'Approve')
        : h('span', { class: 'pl-muted' }, 'Therapist approval required'))));
    const approved = words.filter(w => w.status !== 'draft');
    if (approved.length) {
      const cols = '1fr 1.6fr .7fr .8fr';
      const card = h('div', { class: 'con-tablecard' });
      card.append(h('div', { class: 'con-head', style: `grid-template-columns:${cols}` },
        h('span', {}, 'Word'), h('span', {}, 'Meaning cue'), h('span', {}, 'First sound'), h('span', {}, 'Kind')));
      approved.forEach(w => card.append(h('div', { class: 'con-row', style: `grid-template-columns:${cols}` },
        h('span', { style: 'font-weight:600;font-size:16px' }, w.text),
        h('input', { class: 'con-cue', value: w.cue || '', 'aria-label': `Meaning cue for ${w.text}`, oninput: (e) => { w.cue = e.target.value; } }),
        h('span', { style: 'font-size:15px' }, w.first || '—'),
        h('span', { class: 'pl-muted', style: 'font-size:14px' }, w.kind || '—'))));
      wrap.append(card);
    }
    wrap.append(h('div', { class: 'con-card', style: 'margin-top:14px' },
      h('div', { style: 'font-weight:700;font-size:16px;margin-bottom:10px' }, 'Add one of “my phrases” (up to 60 characters)'),
      h('div', { class: 'con-addrow' },
        h('input', { id: 'phrase', class: 'con-input', value: S.phraseDraft, oninput: e => { S.phraseDraft = e.target.value; }, 'aria-label': 'New phrase', maxlength: '60', placeholder: 'Can you open the window?' }),
        h('button', { class: 'con-pill', disabled: S.busy ? '' : null, onclick: addPhrase }, S.busy ? 'Saving…' : 'Add draft'))));
    return wrap;
  }

  // T4 progress grid
  function t4() {
    const g = DATA.grid[S.person] || { days: [], rows: [] };
    const wrap = h('div', {});
    wrap.append(patientHeader(), h('div', { class: 'con-sechead' }, h('h2', { class: 'con-h2' }, 'Progress')), h('p', { class: 'pl-muted', style: 'font-size:13px;margin:0 0 14px' }, 'What happened, not a prediction. ✓ no hint · M meaning · S sound · W word · – not tried.'));
    const table = h('table', { class: 'pl-grid' });
    const head = h('tr', {}, h('th', {}, 'Word')); g.days.forEach(d => head.append(h('th', {}, d)));
    table.append(h('thead', {}, head));
    const body = h('tbody', {});
    g.rows.forEach(r => { const tr = h('tr', {}, h('th', { scope: 'row' }, r.word)); r.cells.forEach((c, i) => { const [sym, cls, label] = CELL[c]; tr.append(h('td', { class: 'pl-cell ' + cls, 'aria-label': `${r.word}, ${g.days[i]}: ${label}` }, sym)); }); body.append(tr); });
    table.append(body);
    wrap.append(h('div', { class: 'con-card', style: 'overflow-x:auto' }, h('div', { class: 'pl-grid-wrap' }, table)));
    return wrap;
  }

  // T5 profile & hint settings
  const NEED_OPTIONS = [
    ['finding_words', 'Finding the word'], ['words_out', 'Getting words started'],
    ['being_heard', 'Being loud enough'], ['being_clear', 'Being clear'], ['saving_energy', 'Getting tired']
  ];
  function t5() {
    const s = DATA.settings[S.person] || { needs: [], hintOrder: 'meaning-first', hintWait: 7, sessionMin: 20 };
    const keys = s.needKeys || NEED_OPTIONS.filter(([,label]) => s.needs.includes(label)).map(([key]) => key);
    const locked = s.canEdit === false || S.busy;
    const pill = (label, active, change, disabled = false) => h('button', {
      'aria-pressed': String(active), disabled: locked || disabled ? '' : null,
      onclick: () => saveProfile(change)
    }, label);
    const row = (label, name, current, choices) => h('div', {class:'pl-setting'},
      h('div', {class:'pl-setting__row'}, h('span', {}, label),
        h('span', {class:'pl-pill'}, [...new Set([...choices,current])].filter(n => n !== undefined).map(n =>
          pill(n === null ? 'Never' : String(n), n === current, {[name]:n},
            keys.includes('words_out') && ['backchannel_s','offer_hint_s'].includes(name) && n !== null)))));
    const wrap = h('div', {});
    wrap.append(patientHeader(), h('div', {class:'con-sechead'}, h('h2', {class:'con-h2'}, 'Profile & hints')));
    if (s.canEdit === false) wrap.append(h('p', {class:'pl-muted'}, 'Only the linked therapist can change these settings.'));
    wrap.append(h('div', {class:'pl-setting'}, h('span', {}, "What's hard when talking"),
      h('div', {class:'pl-pill'}, NEED_OPTIONS.map(([key,label]) => {
        const active = keys.includes(key);
        return pill(label, active, {needs: active ? keys.filter(n => n !== key) : [...keys,key]}, active && keys.length === 1);
      }))),
      h('div', {class:'pl-setting'}, h('div', {class:'pl-setting__row'}, h('span', {}, 'Hint order'),
        h('span', {class:'pl-pill'},
          pill('Meaning first', s.hintOrder === 'meaning-first', {hint_order:['meaning','sound','word']}),
          pill('Sound first', s.hintOrder === 'sound-first', {hint_order:['sound','meaning','word']})))),
      row('Listening sound after (seconds)', 'backchannel_s', s.backchannelWait, [4,6,10,null]),
      row('Offer a hint after (seconds)', 'offer_hint_s', s.hintWait, [4,7,9,10,15,null]),
      row('End turn after (seconds)', 'max_wait_s', s.maxWait, [8,12,20,30,60,120,null]),
      row('Session length (minutes)', 'max_session_min', s.sessionMin, [5,10,15,20,30,null]),
      h('p', {class:'pl-muted'}, 'Saved settings apply to new sessions. The person can always make a wait longer or switch it off.'));
    return wrap;
  }

  async function saveProfile(changes) {
    if (S.busy || DATA.settings[S.person]?.canEdit === false) return;
    const person = S.person, credential = accessToken;
    S.busy = true; S.error = ''; render();
    try {
      if (API != null) {
        const result = await api(`settings/${encodeURIComponent(person)}`, {
          method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(changes)
        });
        if (S.signedIn && accessToken === credential) {
          DATA.settings[person] = result;
          const entry = DATA.caseload.find(p => p.id === person);
          if (entry) entry.needs = result.needs;
        }
      } else {
        const s = DATA.settings[person] ||= {needs:[]};
        if ('needs' in changes) {
          s.needKeys = changes.needs;
          s.needs = NEED_OPTIONS.filter(([key]) => changes.needs.includes(key)).map(([,label]) => label);
          if (changes.needs.includes('words_out')) s.backchannelWait = s.hintWait = null;
        }
        if ('hint_order' in changes) s.hintOrder = changes.hint_order[0] + '-first';
        for (const [field,key] of [['backchannel_s','backchannelWait'],['offer_hint_s','hintWait'],['max_wait_s','maxWait'],['max_session_min','sessionMin']]) {
          if (field in changes) s[key] = changes[field];
        }
      }
    } catch (error) { S.error = error.message; }
    finally { S.busy = false; render(); }
  }

  // T6 consent & export
  function t6() {
    const c = DATA.consent[S.person] || { tellCarerLowMood: false, dataSharing: false };
    const toggle = (label, key) => h('div', { class: 'pl-setting' }, h('div', { class: 'pl-setting__row' }, h('span', {}, label),
      h('button', { class: 'pl-btn pl-btn--secondary', 'aria-pressed': String(c[key]), disabled: S.busy, onclick: () => saveConsent(key, !c[key]) }, c[key] ? 'On' : 'Off')));
    const wrap = h('div', {});
    wrap.append(patientHeader(), h('div', { class: 'con-sechead' }, h('h2', { class: 'con-h2' }, 'Consent & export')),
      toggle('Tell the carer if I express distress', 'tellCarerLowMood'),
      toggle('Keep practice data to show progress', 'dataSharing'),
      toggle('Share practice data with my therapist', 'shareWithTherapist'),
      h('p', { class: 'pl-muted' }, 'Record the person’s own choices. A helper supports the decision.'),
      h('div', { class: 'pl-btn-row', style: 'margin-top:16px' },
        h('button', { class: 'con-pill', onclick: exportCsv }, '⬇ Export CSV'),
        h('button', { class: 'con-delete', onclick: deleteAll }, '🗑 Delete everything')),
      h('p', { class: 'pl-muted' }, 'Export includes “my phrases” as plain text. Delete removes all words, photos and attempts within 24 hours.'));
    return wrap;
  }

  async function saveConsent(key, value) {
    if (S.busy) return;
    if (!window.confirm('Has the person explicitly chosen to ' + (value ? 'allow' : 'turn off') + ' this?')) return;
    const person = S.person;
    S.busy = true; S.error = ''; render();
    try {
      if (API == null) DATA.consent[person] = { ...DATA.consent[person], [key]: value };
      else DATA.consent[person] = await api(`consent/${encodeURIComponent(person)}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [key]: value, personConfirmed: true })
      });
    } catch (error) { S.error = error.message; }
    finally { S.busy = false; render(); }
  }

  function exportCsv() {
    const words = DATA.words[S.person] || [];
    let csv = 'type,word_or_phrase,kind\n';
    words.forEach(w => { csv += `word,${JSON.stringify(w.text)},${w.kind}\n`; });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${S.person}.csv`; a.click();
  }
  function deleteAll() {
    // Second confirmation screen (DS-T07).
    const ok = window.confirm('Delete everything for ' + name(S.person) + '? This cannot be undone.');
    if (ok) { DATA.words[S.person] = []; alert('Deletion requested. Completes within 24 hours.'); render(); }
  }

  function name(id) { const p = DATA.caseload.find(x => x.id === id); return p ? p.name : id; }

  /* Live data from the app server's console API (GET /api/console/...). When opened from disk
   * (file://) or with ?mock=1, the mock DATA above is used instead, so the console still works
   * offline. */
  async function api(path, options = {}) {
    const headers = { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` };
    const response = await fetch(`${API}/api/console/${path}`, { ...options, headers, cache: 'no-store' });
    if (!response.ok) {
      if (response.status === 401) {
        accessToken = ''; S.signedIn = false; clearData();
      }
      const body = await response.json().catch(() => ({}));
      throw new Error(typeof body.detail === 'string' ? body.detail : response.status === 422 ? 'Check the word or phrase and try again.' : 'Could not complete the request. Please try again.');
    }
    return response.json();
  }

  async function signIn(demo) {
    if (API == null) { S.signedIn = true; S.error = ''; render(); return; }
    const input = document.getElementById('access-token');
    accessToken = demo ? '' : input.value.trim();
    if (input) input.value = '';
    S.busy = true; S.error = ''; render();
    try {
      if (demo) {
        const response = await fetch(`${API}/api/console/demo/session`, { method: 'POST', cache: 'no-store' });
        if (!response.ok) throw new Error('Judge demo is unavailable on this server.');
        accessToken = (await response.json()).token;
      }
      const user = await api('me');
      S.role = user.role; S.demo = user.demo;
      await hydrate();
      S.signedIn = true; S.tab = 'T2';
    } catch (error) {
      accessToken = ''; S.signedIn = false; clearData(); S.error = error.message;
    } finally { S.busy = false; render(); }
  }

  async function signOut() {
    try { if (API != null) await api('logout', { method: 'POST' }); }
    catch (error) { /* Local credentials are discarded even if the server is unreachable. */ }
    accessToken = ''; S.signedIn = false; S.error = ''; S.phraseDraft = '';
    if (API != null) clearData();
    render();
  }

  async function addPhrase() {
    if (S.busy) return;
    const text = document.getElementById('phrase').value.trim();
    if (!text) return;
    const person = S.person, credential = accessToken;
    S.phraseDraft = text; S.error = ''; S.busy = true; render();
    try {
      let word;
      if (API != null) {
        const result = await api(`words/${encodeURIComponent(person)}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, kind: 'phrase' })
        });
        if (!S.signedIn || accessToken !== credential) return;
        word = result.word;
      } else {
        word = { id: 'p-' + Date.now(), text, kind: 'phrase', cue: '', first: text[0].toUpperCase(),
                 status: 'draft', by: S.role === 'therapist' ? 'slt' : 'carer' };
      }
      (DATA.words[person] ||= []).push(word);
      if (S.person === person) S.phraseDraft = '';
    } catch (error) { S.error = error.message; }
    finally { S.busy = false; render(); }
  }

  async function approveWord(w) {
    if (API != null) {
      try {
        const result = await api(`words/${encodeURIComponent(S.person)}/${encodeURIComponent(w.id)}/approve`, { method: 'POST' });
        Object.assign(w, result.word); S.error = ''; render();
      } catch (error) { S.error = error.message; render(); }
      return;
    }
    w.status = 'approved'; render();
  }

  async function hydrate() {
    if (API == null) return;  // file:// or ?mock=1 -> keep the mock DATA
      const cl = await api('caseload');
      DATA.therapist.name = cl.therapist.name;
      DATA.caseload = cl.caseload;
      S.person = cl.caseload[0]?.id || '';
      await Promise.all(cl.caseload.map(async (p) => {
        const person = encodeURIComponent(p.id);
        const [w, g, s, c] = await Promise.all([
          api(`words/${person}`),
          S.role === 'therapist' ? api(`grid/${person}`) : Promise.resolve({ days: [], rows: [] }),
          api(`settings/${person}`),
          api(`consent/${person}`),
        ]);
        DATA.words[p.id] = w.words;
        DATA.grid[p.id] = { days: g.days, rows: g.rows };
        DATA.settings[p.id] = s;
        DATA.consent[p.id] = c;
      }));
  }

  const order = { system: 'light', light: 'dark', dark: 'system' };
  document.getElementById('theme').addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme') || 'system'; const n = order[cur]; if (n === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', n); });

  render();
  </script>
</body>
</html>
