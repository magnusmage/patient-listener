<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Patient Listener — a voice practice partner that waits (offline demo)." />
  <title>Patient Listener — demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <a class="pl-visually-hidden" href="#pl-root">Skip to content</a>
  <main id="pl-root" role="main"></main>

  <!--
    Offline demo / replay mode. This page deliberately loads the SAME client.js + app.js + CSS as
    the real app (index.html) instead of inlining its own copy, so the demo can never drift from the
    product. It sets neither window.PL_API nor window.PL_WS_URL, so plMode() resolves to 'demo' (the
    in-browser DemoEngine) — no microphone, no network. Works opened from disk or over http; either
    way it runs fully offline. To exercise the live/server transports instead, open index.html
    (optionally index.html?voice=1), or the first screen's Voice / Chat picker.
  -->
  <script src="client.js"></script>
  <script src="app.js"></script>
</body>
</html>
